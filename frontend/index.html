<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KidPrompt — kids make games with words</title>
    <meta name="description" content="Kids describe a game or app in their own words, KidPrompt builds it, and a grown-up helps share it with family and friends." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        font-family: "Figtree", system-ui, sans-serif;
        background: #fff8ef;
        color: #2a2235;
      }
      button,
      input,
      textarea,
      select {
        font-family: inherit;
        font-size: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      a {
        color: inherit;
      }
      ::placeholder {
        color: inherit;
        opacity: 0.45;
      }
      @keyframes screenIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(-6deg) scale(1); }
        50% { transform: rotate(6deg) scale(1.08); }
      }
      .kp-card-link:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 24px rgba(42, 34, 53, 0.12) !important;
      }
      @media (max-width: 760px) {
        .kp-editor {
          grid-template-columns: 1fr !important;
        }
        .kp-hero-title {
          font-size: 38px !important;
        }
        .kp-editor > section:first-child {
          height: 360px !important;
          min-height: 0 !important;
        }
      }
      .kp-nav a,
      .kp-nav button {
        white-space: nowrap;
      }
      @media (max-width: 480px) {
        .kp-brand-text {
          font-size: 20px !important;
        }
        .kp-nav-play {
          display: none !important;
        }
        .kp-nav a,
        .kp-nav button {
          padding: 9px 12px !important;
          font-size: 14px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
